<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — TraceVault</title>
  <link rel="stylesheet" href="../css/veriables.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/login.css">
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="../assets/logo.svg" class="auth-logo__img" alt="TraceVault" />
      <span class="auth-logo__name">TraceVault</span>
    </div>

    <!-- Heading -->
    <div class="auth-head">
      <h1 class="auth-head__title">Welcome back</h1>
      <p class="auth-head__sub">Sign in to continue verifying digital evidence securely and access your forensic dashboard.</p>
    </div>

    <!-- Error alert -->
    <div class="auth-err auth-err--danger" id="loginErr" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="loginErrMsg">Invalid email or password.</span>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <div class="form-group" id="grpEmail">
        <label class="form-label" for="email">Email address</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" id="email" class="form-ctrl" placeholder="Enter your email" autocomplete="email" required />
        </div>
        <span class="form-err" id="emailErr">Please enter a valid email.</span>
      </div>

      <div class="form-group" id="grpPwd">
  <label class="form-label" for="password">Password</label>

  <div class="input-wrap input-wrap--r">
    <!-- Key icon: now INSIDE the wrap, before the input -->
    <span class="input-icon">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.15533 14.5116C1.84274 14.8241 1.66709 15.248 1.66699 15.69V17.5C1.66699 17.721 1.75479 17.9329 1.91107 18.0892C2.06735 18.2455 2.27931 18.3333 2.50033 18.3333H5.00033C5.22134 18.3333 5.4333 18.2455 5.58958 18.0892C5.74586 17.9329 5.83366 17.721 5.83366 17.5V16.6666C5.83366 16.4456 5.92146 16.2337 6.07774 16.0774C6.23402 15.9211 6.44598 15.8333 6.66699 15.8333H7.50033C7.72134 15.8333 7.9333 15.7455 8.08958 15.5892C8.24586 15.4329 8.33366 15.221 8.33366 15V14.1666C8.33366 13.9456 8.42146 13.7337 8.57774 13.5774C8.73402 13.4211 8.94598 13.3333 9.16699 13.3333H9.31033C9.75232 13.3332 10.1762 13.1576 10.4887 12.845L11.167 12.1666C12.3252 12.5701 13.586 12.5685 14.7432 12.1623C15.9004 11.756 16.8855 10.969 17.5373 9.93007C18.1891 8.89115 18.469 7.66178 18.3313 6.44309C18.1935 5.22439 17.6463 4.08851 16.779 3.22128C15.9118 2.35404 14.7759 1.80679 13.5572 1.66905C12.3385 1.5313 11.1091 1.81122 10.0702 2.46301C9.0313 3.11479 8.24432 4.09986 7.83803 5.25707C7.43175 6.41428 7.4302 7.67511 7.83366 8.8333L2.15533 14.5116Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="13.75" cy="6.25" r="0.6" fill="currentColor"/>
      </svg>
    </span>

    <input type="password" id="password" class="form-ctrl" placeholder="Enter your password" autocomplete="current-password" required />

    <button type="button" class="input-icon-r" id="togglePwd" aria-label="Toggle password">
      <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <span class="form-err" id="pwdErr">Please enter your password.</span>
</div>

      <!-- Remember + Forgot -->
      <div class="forgot-row">
        <label class="form-check">
          <input type="checkbox" id="remember" />
          <span class="form-check__lbl">Remember me</span>
        </label>
        <a href="forget-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>

    <!-- Divider -->
    <div class="divider">or continue with</div>

    <!-- Social -->
    <div style="display:flex;flex-direction:column;gap:var(--sp-2);">
      <button class="social-btn" type="button">
        <span class="social-btn__ico">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        </span>
        Continue with Google
      </button>
    </div>

    <div class="auth-foot">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>

  </div>
  
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => TraceVaultAuth.initLoginPage());</script>
</body>
</html>
