<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Password — TraceVault</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
<main class="reset">
  <div class="reset__card">
    <a href="../../index.html" class="brand">
      <img class="brand__logo" src="../assets/logo.svg" alt="" width="58" height="52" />
      <span class="brand__text"><span class="brand__name">Trace<span>Vault</span></span><span class="brand__tag">Verify Before You Trust</span></span>
    </a>
    <h1>Create New Password</h1>
    <p>Your new password must be different from your previous passwords.</p>
    <form class="auth__fields" id="resetForm" novalidate>
      <div class="field" id="fPassword">
        <label class="field__label" for="password">New Password</label>
        <div class="field__control"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="password" name="password" type="password" placeholder="Enter new password" autocomplete="new-password" required />
          <button type="button" class="field__toggle" data-toggle-password aria-label="Show password"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="m2 2 20 20"/></svg></button></div>
        <span class="field__error"></span>
      </div>
      <div class="field" id="fConfirm">
        <label class="field__label" for="confirm">Confirm Password</label>
        <div class="field__control"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="confirm" name="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password" required />
          <button type="button" class="field__toggle" data-toggle-password aria-label="Show password"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="m2 2 20 20"/></svg></button></div>
        <span class="field__error"></span>
      </div>
      <p class="reset__hint"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>Use at least 8 characters with letters and numbers.</p>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Reset Password <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </form>
    <a href="login.html" class="auth__back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to Sign In</a>
  </div>
  <p class="reset__copy">&copy; 2026 TraceVault. All rights reserved.</p>
</main>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
