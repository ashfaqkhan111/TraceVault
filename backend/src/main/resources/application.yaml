spring:
  application:
    name: tracevault-backend

  # --- PostgreSQL Database Connection ---
  # The values to the right of the “:” are the default values for this laptop.
  # If they are different, set the DB_URL, DB_USERNAME, and DB_PASSWORD environment variables.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracevault}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: none        # The table was created by Flyway, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Upload size limit (same as the limit in frontend/js/upload.js) ---
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080

app:
  jwt:
    # MUST be replaced on the actual server (at least 32 random characters).
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
    expiration-hours: 24
  cors:
    # Frontend addresses that are allowed to call the API (separate with commas).
    # 5500 = VS Code Live Server, 3000/5173/8000 = general dev servers.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000}
